{{ define "main" }}
<article class="class">
  <h1>{{ .Title }}</h1>

  {{ with .Params.authors }}<h3>{{ . }}</h3>{{ end }}
  {{ with .Params.event }}<h3>{{ . }}</h3>{{ end }}

  <div class="entry">
    {{ if eq .Params.type "paper" }}Abstract: {{ end }}{{ .Content }}
  </div>

  {{ if .Params.mathjax }}
  <script type="text/javascript" async src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.2/MathJax.js?config=TeX-MML-AM_CHTML'></script>
  {{ end }}
</article>
{{ end }}
