{{ define "main" }}
<article class="page">
  <h1>{{ .Title }}</h1>

  <div class="entry">
    {{ .Content }}

    <p class="research-legend">
      <span class="research-tag tag-paper">Paper</span>
      <span class="research-tag tag-talk">Talk</span>
      <span class="research-tag tag-project">Project</span>
      <span class="research-tag tag-press">Press</span>
    </p>

    {{ range .Pages.ByDate.Reverse }}
    <p>
      <span class="research-tag tag-{{ .Params.type | default "paper" }}">{{ .Params.type | default "paper" }}</span>
      <a href="{{ .RelPermalink }}">{{ .Title }} ({{ .Date.Format "2006" }})</a>
    </p>
    {{ end }}
  </div>
</article>
{{ end }}
